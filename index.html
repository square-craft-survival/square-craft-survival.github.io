
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Square Craft Survival</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="startScreen">
        <h1>SQUARE CRAFT SURVIVAL</h1>

        <p>Definitely an original block survival game.</p>

        <button id="playButton">PLAY</button>
    </div>

    <div id="game">
        <div id="crosshair">+</div>

        <div id="hotbar">
            <div class="slot selected">1</div>
            <div class="slot">2</div>
            <div class="slot">3</div>
            <div class="slot">4</div>
            <div class="slot">5</div>
        </div>
    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
